<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-light desc-light">
  <title id="title-light">Md Shahriar Fahim — Full Stack Developer, CSE Student, AI Enthusiast</title>
  <desc id="desc-light">Animated light-mode hero banner with a slow gradient accent line and a blinking terminal-style cursor.</desc>

  <defs>
    <linearGradient id="accentLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1477E6" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#1477E6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1477E6" stop-opacity="0.15">
        <animate attributeName="offset" values="1;1.6;1" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="900" height="220" fill="#f6f8fa"/>

  <!-- accent line: single slow draw-in, no repeated flashing -->
  <rect x="60" y="60" width="0" height="3" fill="url(#accentLight)" rx="1.5">
    <animate attributeName="width" from="0" to="120" dur="1.2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
  </rect>

  <text x="60" y="115" font-family="'Segoe UI', 'Fira Code', monospace" font-size="38" font-weight="700" fill="#0d1117">
    Md Shahriar Fahim
  </text>

  <text x="60" y="150" font-family="'Segoe UI', monospace" font-size="18" fill="#57606a">
    Full Stack Developer&#160;&#160;·&#160;&#160;CSE Student&#160;&#160;·&#160;&#160;AI Enthusiast
  </text>

  <text x="60" y="185" font-family="'Fira Code', monospace" font-size="14" fill="#1477E6">
    building modern web experiences and exploring AI
  </text>
  <text x="382" y="185" font-family="'Fira Code', monospace" font-size="14" fill="#1477E6">
    _
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.8s" repeatCount="indefinite"/>
  </text>
</svg>