<svg width="900" height="6" viewBox="0 0 900 6" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decorative section divider">
  <defs>
    <linearGradient id="divGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="45%" stop-color="#1477E6"/>
      <stop offset="55%" stop-color="#1477E6"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-300 0;300 0;-300 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="900" height="6" fill="url(#divGradLight)"/>
</svg>