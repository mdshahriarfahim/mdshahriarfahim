<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-stt desc-stt">
  <title id="title-stt">Snake + Tic-Tac-Toe — concept preview</title>
  <desc id="desc-stt">Stylized design concept preview for the Snake and Tic-Tac-Toe C project: a retro pixel-style snake panel and a tic-tac-toe grid panel with a highlighted win line. This is a stylized concept representation, not an actual screenshot of the original C game.</desc>

  <defs>
    <linearGradient id="bgSTT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#101825"/>
    </linearGradient>
    <linearGradient id="glassSTT" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="dotsSTT" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#22304a"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgSTT)"/>

  <!-- PROJECT PREVIEW badge -->
  <rect x="640" y="18" width="142" height="26" rx="13" fill="none" stroke="#2F9BFF" stroke-width="1" opacity="0.7"/>
  <text x="711" y="35" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#2F9BFF" text-anchor="middle">PROJECT PREVIEW</text>

  <!-- header -->
  <rect x="0" y="0" width="800" height="66" fill="#111826"/>
  <rect x="0" y="65" width="800" height="1" fill="#22304a"/>
  <text x="28" y="34" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#ffffff">SNAKE <tspan fill="#2F9BFF">+ TIC-TAC-TOE</tspan></text>
  <text x="28" y="52" font-family="'Fira Code', monospace" font-size="11" fill="#8b949e">C</text>

  <!-- LEFT PANEL: Snake -->
  <rect x="28" y="100" width="358" height="270" rx="12" fill="url(#glassSTT)" stroke="#22304a" stroke-width="1"/>
  <text x="48" y="126" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#8b949e">SNAKE</text>
  <rect x="48" y="140" width="318" height="210" rx="6" fill="#0d1117"/>
  <rect x="48" y="140" width="318" height="210" fill="url(#dotsSTT)"/>

  <!-- snake body: connected pixel-style segments -->
  <g>
    <rect x="90" y="300" width="16" height="16" rx="2" fill="#1477E6" opacity="0.55"/>
    <rect x="90" y="280" width="16" height="16" rx="2" fill="#1477E6" opacity="0.65"/>
    <rect x="90" y="260" width="16" height="16" rx="2" fill="#2F9BFF" opacity="0.75"/>
    <rect x="110" y="260" width="16" height="16" rx="2" fill="#2F9BFF" opacity="0.85"/>
    <rect x="130" y="260" width="16" height="16" rx="2" fill="#2F9BFF" opacity="0.95"/>
    <rect x="130" y="240" width="16" height="16" rx="2" fill="#2F9BFF"/>
    <!-- head, subtle glow pulse -->
    <rect x="130" y="220" width="16" height="16" rx="3" fill="#2F9BFF">
      <animate attributeName="opacity" values="1;0.6;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- food -->
  <rect x="200" y="190" width="14" height="14" rx="7" fill="#e5534b" opacity="0.9"/>

  <text x="48" y="368" font-family="'Segoe UI', sans-serif" font-size="10" fill="#57606a">Classic grid-based snake gameplay</text>

  <!-- RIGHT PANEL: Tic-Tac-Toe -->
  <rect x="414" y="100" width="358" height="270" rx="12" fill="url(#glassSTT)" stroke="#22304a" stroke-width="1"/>
  <text x="434" y="126" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#8b949e">TIC-TAC-TOE</text>

  <!-- 3x3 grid, cell size 80, starting at (473,150) -->
  <g stroke="#2c3a52" stroke-width="2">
    <line x1="553" y1="150" x2="553" y2="390"/>
    <line x1="633" y1="150" x2="633" y2="390"/>
    <line x1="473" y1="230" x2="713" y2="230"/>
    <line x1="473" y1="310" x2="713" y2="310"/>
  </g>

  <!-- marks: X diagonal win, O as blockers -->
  <g stroke="#2F9BFF" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M493,170 L533,210 M533,170 L493,210"/>
    <path d="M573,250 L613,290 M613,250 L573,290"/>
    <path d="M653,330 L693,370 M693,330 L653,370"/>
  </g>
  <g stroke="#8b949e" stroke-width="4" fill="none">
    <circle cx="593" cy="190" r="20"/>
    <circle cx="493" cy="270" r="20"/>
  </g>

  <!-- winning line: single draw-in, plays once -->
  <line x1="493" y1="170" x2="693" y2="370" stroke="#3fb950" stroke-width="3" stroke-dasharray="280" stroke-dashoffset="280">
    <animate attributeName="stroke-dashoffset" from="280" to="0" dur="1.4s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
  </line>

  <text x="434" y="368" font-family="'Segoe UI', sans-serif" font-size="10" fill="#57606a">Two-player local grid gameplay</text>

  <!-- CONCEPT PREVIEW watermark -->
  <text x="400" y="425" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#2F9BFF" opacity="0.55" text-anchor="middle">CONCEPT PREVIEW — NOT AN ACTUAL SCREENSHOT</text>
</svg>