<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-ele desc-ele">
  <title id="title-ele">Elevator Simulation — concept preview</title>
  <desc id="desc-ele">Stylized design concept preview for the Elevator Simulation project: a 6-floor shaft with a moving cabin, direction indicators, a door-open/close motif, and an illustrative floor-request queue. This is a stylized concept representation, not an actual screenshot of the original graphics.h/WinBGIm application.</desc>

  <defs>
    <linearGradient id="bgELE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#101825"/>
    </linearGradient>
    <linearGradient id="glassELE" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgELE)"/>

  <!-- PROJECT PREVIEW badge -->
  <rect x="640" y="18" width="142" height="26" rx="13" fill="none" stroke="#2F9BFF" stroke-width="1" opacity="0.7"/>
  <text x="711" y="35" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#2F9BFF" text-anchor="middle">PROJECT PREVIEW</text>

  <!-- header -->
  <rect x="0" y="0" width="800" height="66" fill="#111826"/>
  <rect x="0" y="65" width="800" height="1" fill="#22304a"/>
  <text x="28" y="34" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#ffffff">ELEVATOR <tspan fill="#2F9BFF">SIMULATION</tspan></text>
  <text x="28" y="52" font-family="'Fira Code', monospace" font-size="11" fill="#8b949e">C++ &#160;&#183;&#160; WinBGIm</text>

  <!-- shaft -->
  <rect x="330" y="90" width="160" height="300" rx="6" fill="url(#glassELE)" stroke="#22304a" stroke-width="1.2"/>
  <!-- floor separators + labels (6 floors) -->
  <g stroke="#22304a" stroke-width="1">
    <line x1="330" y1="140" x2="490" y2="140"/>
    <line x1="330" y1="190" x2="490" y2="190"/>
    <line x1="330" y1="240" x2="490" y2="240"/>
    <line x1="330" y1="290" x2="490" y2="290"/>
    <line x1="330" y1="340" x2="490" y2="340"/>
  </g>
  <g font-family="'Fira Code', monospace" font-size="11" fill="#57606a" text-anchor="end">
    <text x="322" y="119">6</text>
    <text x="322" y="169">5</text>
    <text x="322" y="219">4</text>
    <text x="322" y="269">3</text>
    <text x="322" y="319">2</text>
    <text x="322" y="369">1</text>
  </g>

  <!-- moving cabin group: translates smoothly between floor 1 and floor 6 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,345;0,95;0,345" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" dur="10s" repeatCount="indefinite"/>
    <rect x="335" y="0" width="110" height="40" rx="5" fill="#0d1117" stroke="#2F9BFF" stroke-width="1.4"/>
    <!-- door leaves: subtle open/close motif -->
    <rect x="337" y="2" width="53" height="36" rx="3" fill="#16233a">
      <animate attributeName="width" values="53;30;53" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="392" y="2" width="53" height="36" rx="3" fill="#16233a">
      <animate attributeName="x" values="392;415;392" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="width" values="53;30;53" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- direction indicators -->
  <g>
    <path d="M508,120 L520,140 L496,140 Z" fill="#2F9BFF">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.5;0.99;1" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M508,360 L520,340 L496,340 Z" fill="#2F9BFF">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.49;0.5;0.99;1" dur="10s" repeatCount="indefinite"/>
    </path>
    <text x="508" y="185" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">DIRECTION</text>
  </g>

  <!-- queue / requests panel (illustrative concept, not real data) -->
  <rect x="560" y="90" width="212" height="130" rx="12" fill="url(#glassELE)" stroke="#22304a" stroke-width="1"/>
  <text x="578" y="114" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#8b949e">FLOOR QUEUE (concept)</text>
  <g font-family="'Fira Code', monospace" font-size="13" fill="#ffffff">
    <circle cx="592" cy="140" r="12" fill="none" stroke="#2F9BFF" stroke-width="1.3"/>
    <text x="592" y="144" text-anchor="middle">2</text>
    <circle cx="632" cy="140" r="12" fill="none" stroke="#2F9BFF" stroke-width="1.3"/>
    <text x="632" y="144" text-anchor="middle">5</text>
    <circle cx="672" cy="140" r="12" fill="none" stroke="#2F9BFF" stroke-width="1.3"/>
    <text x="672" y="144" text-anchor="middle">3</text>
  </g>
  <text x="578" y="176" font-family="'Segoe UI', sans-serif" font-size="10" fill="#57606a">Pending floor requests, illustrative</text>
  <text x="578" y="196" font-family="'Segoe UI', sans-serif" font-size="10" fill="#57606a">example — not live simulation data</text>

  <!-- CONCEPT PREVIEW watermark -->
  <text x="400" y="425" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#2F9BFF" opacity="0.55" text-anchor="middle">CONCEPT PREVIEW — NOT AN ACTUAL SCREENSHOT</text>
</svg>