<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-inv desc-inv">
  <title id="title-inv">Inventory Management System — concept preview</title>
  <desc id="desc-inv">Design concept preview for the Inventory Management System: a mock admin dashboard with summary cards, a filter bar, and a data table with stock-status indicators. This is an illustrative concept placeholder, not a screenshot of the actual application.</desc>

  <defs>
    <linearGradient id="bgINV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#101825"/>
    </linearGradient>
    <linearGradient id="glassINV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgINV)"/>

  <!-- PROJECT PREVIEW badge -->
  <rect x="640" y="18" width="142" height="26" rx="13" fill="none" stroke="#2F9BFF" stroke-width="1" opacity="0.7"/>
  <text x="711" y="35" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#2F9BFF" text-anchor="middle">PROJECT PREVIEW</text>

  <!-- header bar -->
  <rect x="0" y="0" width="800" height="66" fill="#111826"/>
  <rect x="0" y="65" width="800" height="1" fill="#22304a"/>
  <text x="28" y="41" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#ffffff">INVENTORY <tspan fill="#2F9BFF">MANAGEMENT</tspan></text>

  <!-- filter/search bar -->
  <rect x="480" y="20" width="220" height="26" rx="13" fill="#0d1117" stroke="#2c3a52" stroke-width="1"/>
  <circle cx="497" cy="33" r="5" fill="none" stroke="#8b949e" stroke-width="1.4"/>
  <line x1="501" y1="37" x2="506" y2="42" stroke="#8b949e" stroke-width="1.4"/>
  <text x="513" y="37" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#57606a">Filter items...</text>

  <!-- summary cards row -->
  <g>
    <rect x="28" y="86" width="176" height="70" rx="12" fill="url(#glassINV)" stroke="#22304a" stroke-width="1"/>
    <text x="46" y="112" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8b949e">TOTAL ITEMS</text>
    <text x="46" y="138" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#ffffff">--</text>
  </g>
  <g>
    <rect x="216" y="86" width="176" height="70" rx="12" fill="url(#glassINV)" stroke="#22304a" stroke-width="1"/>
    <text x="234" y="112" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8b949e">CATEGORIES</text>
    <text x="234" y="138" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#ffffff">--</text>
  </g>
  <g>
    <rect x="404" y="86" width="176" height="70" rx="12" fill="url(#glassINV)" stroke="#22304a" stroke-width="1"/>
    <text x="422" y="112" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8b949e">LOW STOCK</text>
    <text x="422" y="138" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#f0a832">--</text>
  </g>
  <g>
    <rect x="592" y="86" width="180" height="70" rx="12" fill="url(#glassINV)" stroke="#22304a" stroke-width="1"/>
    <text x="610" y="112" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8b949e">OUT OF STOCK</text>
    <text x="610" y="138" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#e5534b">--</text>
  </g>

  <!-- data table -->
  <rect x="28" y="176" width="744" height="200" rx="12" fill="url(#glassINV)" stroke="#22304a" stroke-width="1"/>

  <!-- table header -->
  <text x="48" y="202" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="600" letter-spacing="1" fill="#8b949e">ITEM</text>
  <text x="380" y="202" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="600" letter-spacing="1" fill="#8b949e">CATEGORY</text>
  <text x="560" y="202" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="600" letter-spacing="1" fill="#8b949e">STOCK</text>
  <text x="680" y="202" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="600" letter-spacing="1" fill="#8b949e">STATUS</text>
  <line x1="28" y1="212" x2="772" y2="212" stroke="#22304a" stroke-width="1"/>

  <!-- row 1 -->
  <rect x="48" y="226" width="150" height="10" rx="5" fill="#ffffff" opacity="0.8"/>
  <rect x="380" y="226" width="80" height="9" rx="4" fill="#57606a"/>
  <rect x="560" y="226" width="40" height="9" rx="4" fill="#57606a"/>
  <circle cx="685" cy="230" r="4" fill="#3fb950"/>
  <text x="696" y="234" font-family="'Segoe UI', sans-serif" font-size="10" fill="#3fb950">In Stock</text>

  <!-- row 2 -->
  <rect x="48" y="258" width="130" height="10" rx="5" fill="#ffffff" opacity="0.8"/>
  <rect x="380" y="258" width="70" height="9" rx="4" fill="#57606a"/>
  <rect x="560" y="258" width="40" height="9" rx="4" fill="#57606a"/>
  <circle cx="685" cy="262" r="4" fill="#f0a832"/>
  <text x="696" y="266" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f0a832">Low Stock</text>

  <!-- row 3 -->
  <rect x="48" y="290" width="160" height="10" rx="5" fill="#ffffff" opacity="0.8"/>
  <rect x="380" y="290" width="90" height="9" rx="4" fill="#57606a"/>
  <rect x="560" y="290" width="40" height="9" rx="4" fill="#57606a"/>
  <circle cx="685" cy="294" r="4" fill="#e5534b"/>
  <text x="696" y="298" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e5534b">Out of Stock</text>

  <!-- row 4 -->
  <rect x="48" y="322" width="120" height="10" rx="5" fill="#ffffff" opacity="0.8"/>
  <rect x="380" y="322" width="75" height="9" rx="4" fill="#57606a"/>
  <rect x="560" y="322" width="40" height="9" rx="4" fill="#57606a"/>
  <circle cx="685" cy="326" r="4" fill="#3fb950"/>
  <text x="696" y="330" font-family="'Segoe UI', sans-serif" font-size="10" fill="#3fb950">In Stock</text>

  <!-- row 5 -->
  <rect x="48" y="354" width="140" height="10" rx="5" fill="#ffffff" opacity="0.8"/>
  <rect x="380" y="354" width="85" height="9" rx="4" fill="#57606a"/>
  <rect x="560" y="354" width="40" height="9" rx="4" fill="#57606a"/>
  <circle cx="685" cy="358" r="4" fill="#3fb950"/>
  <text x="696" y="362" font-family="'Segoe UI', sans-serif" font-size="10" fill="#3fb950">In Stock</text>

  <!-- CONCEPT PREVIEW watermark -->
  <text x="400" y="420" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#2F9BFF" opacity="0.55" text-anchor="middle">CONCEPT PREVIEW — NOT AN ACTUAL SCREENSHOT</text>
</svg>