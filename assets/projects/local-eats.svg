<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-le desc-le">
  <title id="title-le">Local Eats — concept preview</title>
  <desc id="desc-le">Design concept preview for the Local Eats project: a mock food-delivery app interface with a header, search bar, and three food cards. This is an illustrative concept placeholder, not a screenshot of the actual application.</desc>

  <defs>
    <linearGradient id="bgLE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#101825"/>
    </linearGradient>
    <linearGradient id="cardImgLE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F9BFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="glassLE" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="800" height="450" fill="url(#bgLE)"/>

  <!-- PROJECT PREVIEW badge -->
  <rect x="640" y="18" width="142" height="26" rx="13" fill="none" stroke="#2F9BFF" stroke-width="1" opacity="0.7"/>
  <text x="711" y="35" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#2F9BFF" text-anchor="middle">PROJECT PREVIEW</text>

  <!-- header bar -->
  <rect x="0" y="0" width="800" height="66" fill="#111826"/>
  <rect x="0" y="65" width="800" height="1" fill="#22304a"/>
  <text x="28" y="41" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#ffffff">LOCAL <tspan fill="#2F9BFF">EATS</tspan></text>

  <!-- search bar mock -->
  <rect x="230" y="20" width="300" height="26" rx="13" fill="#0d1117" stroke="#2c3a52" stroke-width="1"/>
  <circle cx="248" cy="33" r="5" fill="none" stroke="#8b949e" stroke-width="1.4"/>
  <line x1="252" y1="37" x2="257" y2="42" stroke="#8b949e" stroke-width="1.4"/>
  <text x="265" y="37" font-family="'Segoe UI', sans-serif" font-size="11" fill="#57606a">Search restaurants or dishes</text>

  <!-- location + cart icons -->
  <circle cx="562" cy="33" r="3" fill="none" stroke="#8b949e" stroke-width="1.3"/>
  <path d="M562,27 C566,27 568,31 562,39 C556,31 558,27 562,27 Z" fill="none" stroke="#8b949e" stroke-width="1.2"/>
  <rect x="598" y="24" width="18" height="16" rx="2" fill="none" stroke="#2F9BFF" stroke-width="1.3"/>
  <line x1="601" y1="24" x2="601" y2="20" stroke="#2F9BFF" stroke-width="1.3"/>
  <line x1="613" y1="24" x2="613" y2="20" stroke="#2F9BFF" stroke-width="1.3"/>

  <!-- section label -->
  <text x="28" y="102" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#8b949e">Featured near you</text>

  <!-- three food cards -->
  <g>
    <!-- card 1 -->
    <rect x="28" y="120" width="230" height="270" rx="14" fill="url(#glassLE)" stroke="#22304a" stroke-width="1"/>
    <rect x="28" y="120" width="230" height="130" rx="14" fill="url(#cardImgLE)"/>
    <rect x="44" y="266" width="80" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
    <rect x="44" y="286" width="140" height="9" rx="4" fill="#57606a"/>
    <rect x="44" y="304" width="60" height="9" rx="4" fill="#57606a"/>
    <rect x="44" y="330" width="52" height="20" rx="10" fill="none" stroke="#2F9BFF" stroke-width="1"/>
    <text x="70" y="344" font-family="'Segoe UI', sans-serif" font-size="10" fill="#2F9BFF" text-anchor="middle">Order</text>
    <text x="212" y="344" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="end">$--</text>
  </g>

  <g>
    <!-- card 2 -->
    <rect x="285" y="120" width="230" height="270" rx="14" fill="url(#glassLE)" stroke="#22304a" stroke-width="1"/>
    <rect x="285" y="120" width="230" height="130" rx="14" fill="url(#cardImgLE)"/>
    <rect x="301" y="266" width="90" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
    <rect x="301" y="286" width="150" height="9" rx="4" fill="#57606a"/>
    <rect x="301" y="304" width="70" height="9" rx="4" fill="#57606a"/>
    <rect x="301" y="330" width="52" height="20" rx="10" fill="none" stroke="#2F9BFF" stroke-width="1"/>
    <text x="327" y="344" font-family="'Segoe UI', sans-serif" font-size="10" fill="#2F9BFF" text-anchor="middle">Order</text>
    <text x="469" y="344" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="end">$--</text>
  </g>

  <g>
    <!-- card 3 -->
    <rect x="542" y="120" width="230" height="270" rx="14" fill="url(#glassLE)" stroke="#22304a" stroke-width="1"/>
    <rect x="542" y="120" width="230" height="130" rx="14" fill="url(#cardImgLE)"/>
    <rect x="558" y="266" width="70" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
    <rect x="558" y="286" width="145" height="9" rx="4" fill="#57606a"/>
    <rect x="558" y="304" width="65" height="9" rx="4" fill="#57606a"/>
    <rect x="558" y="330" width="52" height="20" rx="10" fill="none" stroke="#2F9BFF" stroke-width="1"/>
    <text x="584" y="344" font-family="'Segoe UI', sans-serif" font-size="10" fill="#2F9BFF" text-anchor="middle">Order</text>
    <text x="726" y="344" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="end">$--</text>
  </g>

  <!-- CONCEPT PREVIEW watermark: unambiguous, not a real screenshot -->
  <text x="400" y="420" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#2F9BFF" opacity="0.55" text-anchor="middle">CONCEPT PREVIEW — NOT AN ACTUAL SCREENSHOT</text>
</svg>